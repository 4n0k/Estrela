<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrela</title>
    <style>
        /* Reset básico para garantir o minimalismo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estilo geral da página */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fdfdfd; /* Fundo levemente off-white */
            color: #2c2c2c; /* Texto cinza escuro, mais suave que o preto puro */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header e título "Não chamativo" */
        header {
            margin-top: 60px;
            margin-bottom: 40px;
        }

        h1 {
            font-weight: 300; /* Peso da fonte mais fino */
            font-size: 2.25rem;
            letter-spacing: 3px; /* Espaçamento elegante entre as letras */
            text-transform: uppercase;
        }

        /* Contêiner principal para alinhar a imagem e o botão */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* Espaço generoso entre a imagem e o botão */
        }

        /* Imagem quadrada */
        .imagem-quadrada {
            width: 350px;
            height: 350px;
            object-fit: cover;
            background-color: #eaeaea; /* Cor de fundo caso a imagem não carregue */
            border: 1px solid #eee; /* Borda bem sutil */

    </style>
</head>
<body>

    <header>
        <h1>Estrela</h1>
    </header>

    <main>
        <!-- Você pode trocar o link do src pela imagem da sua escolha -->
        <img src="Capa-itch.io.png" alt="Logo Nat pequenina" class="imagem-quadrada">

       <a href="https://itch.io/embed-upload/19068263?color=1b1775" class="button-link">Jogar</a>

          <style>
  .button-link {
    display: inline-block;
    padding: 15px 35px;
    background-color: #0D0F38;
    color: white;
    text-decoration: none;
    border-radius: 5px;
  }
</style>
        <iframe frameborder="0" src="https://itch.io/embed-upload/19068263?color=1b1775" allowfullscreen="" width="320" height="190"><a href="https://azafiss.itch.io/nat">Abrir seu Presenteeee Estrela ☆</a></iframe>
    </main>
    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrela</title>
    <style>
        /* Reset básico para garantir o minimalismo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estilo geral da página */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fdfdfd; /* Fundo levemente off-white */
            color: #2c2c2c; /* Texto cinza escuro, mais suave que o preto puro */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header e título "Não chamativo" */
        header {
            margin-top: 60px;
            margin-bottom: 40px;
        }

        h1 {
            font-weight: 300; /* Peso da fonte mais fino */
            font-size: 2.25rem;
            letter-spacing: 3px; /* Espaçamento elegante entre as letras */
            text-transform: uppercase;
        }

        /* Contêiner principal para alinhar a imagem e o botão */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* Espaço generoso entre a imagem e o botão */
        }

        /* Imagem quadrada */
        .imagem-quadrada {
            width: 400px;
            height: 400px;
            object-fit: cover;
            background-color: #eaeaea; /* Cor de fundo caso a imagem não carregue */
            border: 1px solid #eee; /* Borda bem sutil */
        }

        /* Botão Minimalista */
        .btn-jogar {
            padding: 24px 60px;
            font-family: inherit;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            background-color: #1a1a1a;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-jogar:hover {
            background-color: #555555; /* Efeito suave ao passar o mouse */
        }
    </style>
</head>
<body>

    <header>
        <h1>Estrela</h1>
    </header>

    <main>
        <!-- Você pode trocar o link do src pela imagem da sua escolha -->
        <img src="https://discord.com/channels/@me/1398137040595456080/1544890469002125352" alt="Imagem Quadrada" class="imagem-quadrada">
        
        <button class="btn-jogar">Jogar</button>
    </main>

</body>
</html>
